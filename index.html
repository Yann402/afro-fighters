<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afro Fighters — Légendes de l'Arène</title>
  <meta name="description" content="Jeu de combat 3D inspiré des cultures africaines, jouable dans le navigateur." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%23c99a62%22/%3E%3Cpath d=%22M32 6 L38 40 L32 58 L26 40Z%22 fill=%22%23120b08%22/%3E%3C/svg%3E" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>

    <div id="hud" class="hidden">
      <div class="topbar">
        <div class="side p1">
          <div class="plate"><span class="tag" id="tag0">J1</span><span class="name" id="n0"></span><span class="rounds" id="r0"></span></div>
          <div class="hp"><div class="trail" id="t0"></div><div class="fill" id="h0"></div></div>
          <div class="sub"><div class="guard" id="gw0"><i id="g0"></i></div><div class="meter" id="mw0"><i id="m0"></i><span>POUVOIR</span></div></div>
        </div>
        <div class="clock"><div class="timer" id="timer">60</div><div class="roundLabel" id="roundLabel"></div></div>
        <div class="side p2">
          <div class="plate"><span class="rounds" id="r1"></span><span class="name" id="n1"></span><span class="tag" id="tag1">IA</span></div>
          <div class="hp"><div class="trail" id="t1"></div><div class="fill" id="h1"></div></div>
          <div class="sub"><div class="meter" id="mw1"><i id="m1"></i><span>POUVOIR</span></div><div class="guard" id="gw1"><i id="g1"></i></div></div>
        </div>
      </div>
      <div class="combo left" id="c0"></div>
      <div class="combo right" id="c1"></div>
      <div id="banner"></div>
      <div id="callout"></div>
      <div id="specialBanner"></div>
      <div id="training" class="hidden"></div>
      <div class="hint" id="fightHint"></div>
    </div>

    <div id="screen"></div>
    <div id="toast"></div>
    <div id="loading"><div><b>AFRO FIGHTERS</b><span>Chargement de l'arène…</span></div></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
    <noscript>Ce jeu nécessite JavaScript.</noscript>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
